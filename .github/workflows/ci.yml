name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: MiniTaskManagementDB
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore, Build, Test and Generate HTML Report
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=MiniTaskManagementDB;Username=postgres;Password=postgrespassword"
        run: |
          SLN_PATH=$(find . -name "*.slnx" -o -name "*.sln" | head -n 1)
          dotnet restore "$SLN_PATH"
          dotnet build "$SLN_PATH" --configuration Release --no-restore

          # Chạy test và tạo file log .trx
          dotnet test "$SLN_PATH" --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx" || true

          # Cài đặt trx2html và tạo file HTML
          dotnet tool install --global trx2html || true
          export PATH="$PATH:$HOME/.dotnet/tools"

          # Tìm file .trx vừa tạo và đổi sang .html
          TRX_FILE=$(find . -name "TestResults.trx" | head -n 1)
          if [ -f "$TRX_FILE" ]; then
            trx2html "$TRX_FILE"
          fi

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: |
            **/*.html
            **/*.trx

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & Build Frontend
        run: |
          UI_PATH=$(find . -type d -name "task-ui" | head -n 1)
          echo "Found task-ui directory at: $UI_PATH"
          cd "$UI_PATH"
          npm ci
          npm run lint || echo "Bypass lint"
          npm run build

  sonar:
    name: SonarQube / SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: MiniTaskManagementDB
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run SonarQube Analysis
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=MiniTaskManagementDB;Username=postgres;Password=postgrespassword"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLN_PATH=$(find . -name "*.slnx" -o -name "*.sln" | head -n 1)
          SLN_DIR=$(dirname "$SLN_PATH")
          SLN_NAME=$(basename "$SLN_PATH")
          echo "Working in directory: $SLN_DIR with solution: $SLN_NAME"
          cd "$SLN_DIR"

          dotnet-sonarscanner begin \
            /k:"MiniTaskManagement" \
            /o:"${{ secrets.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/*.opencover.xml" \
            /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**"

          dotnet build "$SLN_NAME"
          dotnet test "$SLN_NAME" --collect:"XPlat Code Coverage" || echo "Tests completed"

          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
