name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: MiniTaskManagementDB
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore, Build, Test and Generate HTML Report
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=MiniTaskManagementDB;Username=postgres;Password=postgrespassword"
        run: |
          SLN_PATH=$(find . -name "*.slnx" -o -name "*.sln" | head -n 1)
          dotnet restore "$SLN_PATH"
          dotnet build "$SLN_PATH" --configuration Release --no-restore

          # 1. Chạy test kèm cờ thu thập Code Coverage và xuất log .trx
          dotnet test "$SLN_PATH" --configuration Release --no-build \
            --logger "trx;LogFileName=TestResults.trx" \
            --collect:"XPlat Code Coverage"

          # 2. Cài đặt ReportGenerator
          dotnet tool install --global dotnet-reportgenerator-globaltool || true
          export PATH="$PATH:$HOME/.dotnet/tools"

          # 3. Tạo báo cáo HTML từ dữ liệu Coverage vừa thu thập
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:"TestReportHtml" \
            -reporttypes:"HtmlSummary;Html"

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: |
            TestReportHtml/
            **/*.trx
